<!doctype html><html lang="en"><head><meta charset="utf-8"><title>scene-switch-16x9</title><style>
@font-face{font-family:Inter;src:url(fonts/inter-500-normal.woff2);font-weight:500}
@font-face{font-family:Inter;src:url(fonts/inter-700-normal.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/inter-800-normal.woff2);font-weight:800}
*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden;background:#0c0c10}
#root{width:100%;height:100%;position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#f6f6f8;-webkit-font-smoothing:antialiased}
.a{position:absolute}.photo{position:absolute;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.eyebrow{position:absolute;font-size:24px;font-weight:700;letter-spacing:5px;text-transform:uppercase;z-index:20}
.heading{position:absolute;font:800 96px/.95 Inter,sans-serif;letter-spacing:-5px;z-index:15}
.presenter{position:absolute;z-index:12}.presenter video{width:100%;height:100%;display:block}
.quiet{position:absolute;text-align:center;font:800 50px/1.08 Inter,sans-serif;color:#fff;letter-spacing:-1.5px;text-shadow:0 2px 4px rgba(0,0,0,.35),0 6px 28px rgba(0,0,0,.45);z-index:25}
</style></head><body>
 <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="4.2" data-fps="30"><div id="scene0" class="photo" style="left:0;top:0;width:1920px;height:1080px;z-index:0;opacity:1"><img src="assets/blue-stairs.jpg"></div><div id="scene1" class="photo" style="left:0;top:0;width:1920px;height:1080px;z-index:1;opacity:0"><img src="assets/red-stairs.jpg"></div><div id="scene2" class="photo" style="left:0;top:0;width:1920px;height:1080px;z-index:2;opacity:0"><img src="assets/cactus.jpg"></div><div class="presenter" style="left:0px;top:0;width:1920px;height:1080px;"><video id="person" src="assets/speaker_cut.webm" muted playsinline data-start="0" data-duration="4.2" data-media-start="0.04" data-track-index="1"></video></div><div class="quiet" id="caption" style="left:360px;top:870px;width:1200px;font-size:56px">change the scene</div></div>
 <script src="vendor/gsap.min.js"></script><script>const tl=gsap.timeline({paused:true});
tl.fromTo('#scene0 img',{scale:1.02},{scale:1.08,duration:1.4,ease:'none'},0);
 tl.set('#scene1',{opacity:1},1.4);tl.set('#scene0',{opacity:0},1.4);
 tl.fromTo('#scene1 img',{scale:1.06},{scale:1,duration:1.4,ease:'none'},1.4);
 tl.set('#scene2',{opacity:1},2.8);tl.set('#scene1',{opacity:0},2.8);
 tl.fromTo('#scene2 img',{scale:1},{scale:1.04,duration:1.4,ease:'none'},2.8);
 tl.set('#caption',{textContent:'keep the story moving'},2.8);
 window.__timelines=window.__timelines||{};window.__timelines.main=tl;</script></body></html>
